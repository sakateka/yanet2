syntax = "proto3";

package objects.ring.controlplane.ringpb.v1;

option go_package = "github.com/yanet-platform/yanet2/objects/ring/controlplane/ringpb/v1;ringpb";

// RingService manages standalone named ring objects.
//
// A ring is a per-worker, cache-line-isolated buffer of opaque records with
// a single writer per worker; a full buffer overwrites the oldest record
// instead of blocking or failing the write. It has no dataplane module of
// its own: a module config can link a ring by name.
service RingService {
  // CreateRing creates a new named ring with a fixed per-worker capacity.
  //
  // Creation fails if a ring with the requested name already exists.
  rpc CreateRing(CreateRingRequest) returns (CreateRingResponse);
  // ListRings returns every registered ring, sorted by name, with the same
  // facts as ShowRing.
  rpc ListRings(ListRingsRequest) returns (ListRingsResponse);
  // ShowRing returns the name and per-worker capacity of one named ring.
  rpc ShowRing(ShowRingRequest) returns (ShowRingResponse);
  // DeleteRing removes a named ring.
  //
  // Deletion fails while the ring is leased by a consumer or still linked
  // into a published configuration generation.
  rpc DeleteRing(DeleteRingRequest) returns (DeleteRingResponse);
}

// RingInfo describes one registered ring: its name and capacity, both fixed
// at creation.
message RingInfo {
  // name identifies the ring.
  string name = 1;
  // capacity is the per-worker buffer size in bytes, fixed at creation as a
  // power of two and never resized afterward.
  uint64 capacity = 2;
}

// CreateRingRequest names the ring to create and its fixed per-worker
// capacity.
message CreateRingRequest {
  // name identifies the new ring; creation fails if a ring with this name
  // already exists.
  string name = 1;
  // capacity is the per-worker buffer size in bytes: a power of two holding
  // at least one record frame, fixed for the life of the ring.
  uint64 capacity = 2;
}

// CreateRingResponse is empty; a successful call publishes the new ring.
message CreateRingResponse {}

// ListRingsRequest carries no fields; ListRings always returns every
// registered ring.
message ListRingsRequest {}

// ListRingsResponse lists every registered ring, sorted by name, with the
// facts ShowRing returns for each.
message ListRingsResponse {
  repeated RingInfo rings = 1;
}

// ShowRingRequest names the ring to describe.
message ShowRingRequest {
  // name identifies the ring to describe.
  string name = 1;
}

// ShowRingResponse carries the facts of one named ring.
message ShowRingResponse {
  RingInfo ring = 1;
}

// DeleteRingRequest names the ring to remove.
message DeleteRingRequest {
  // name identifies the ring to remove; deletion fails while the ring is
  // leased or still linked into a published configuration generation.
  string name = 1;
}

// DeleteRingResponse is empty; a successful call unpublishes the ring.
message DeleteRingResponse {}
